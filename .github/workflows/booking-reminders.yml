name: Booking reminders

# Calls the site every 15 minutes to send visitor reminders and staff follow-up nudges.
# Needs two repository secrets: SITE_URL (for example https://webixsolutions.com) and CRON_SECRET
# (the same value as the CRON_SECRET environment variable on the site).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the reminder job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${SITE_URL%/}/api/booking/reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
